name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
        sanitize: [OFF, ON]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.sanitize == 'ON' && 'Debug' || 'Release' }}
          -DPICOSPEC_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build -j 4
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Benchmark (informational)
        if: matrix.sanitize == 'OFF'
        run: ./build/picospec bench --model models/denoiser_f32.psm --model models/denoiser_int8.psm
